<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Look Max</title>
<meta name="theme-color" content="#fbf7f8">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Look Max">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">
  <div id="demo-banner" class="demo-banner" hidden>Demo mode: not connected to a server. Data stays on this device and the AI results are samples.</div>
  <div id="boot" class="boot">Look Max</div>
  <section id="auth" class="auth" hidden></section>
  <div id="shell" class="shell" hidden>
    <header class="topbar"><span class="brand">Look Max</span><span id="topbar-title" class="topbar-title"></span></header>
    <main id="view" class="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Main">
      <button class="tab" data-tab="0" aria-label="Style">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="4.2"/><path d="M4.5 20c.9-3.6 3.6-5.4 7.5-5.4s6.6 1.8 7.5 5.4"/></svg><span>Style</span>
      </button>
      <button class="tab" data-tab="1" aria-label="Food">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14a0 0 0 0 1 0 0 7 7 0 0 1-7 7 7 7 0 0 1-7-7z"/><path d="M9 8.5c0-1.2 1-1.4 1-2.5M13 8.5c0-1.2 1-1.4 1-2.5"/></svg><span>Food</span>
      </button>
      <button class="tab" data-tab="2" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Settings</span>
      </button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
